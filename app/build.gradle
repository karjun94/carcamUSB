plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karjun.dmaxcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.karjun.dmaxcam'
        minSdk 24
        // The head unit runs Android 11; targeting 30 keeps background-start and USB rules simple.
        targetSdk 30
        versionCode 5
        versionName '1.4'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.13'
    // Keep transitive kotlin-stdlib-jdk7/jdk8 in step with kotlin-stdlib (avoids duplicate classes).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
