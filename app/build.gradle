plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karjun.dmaxcam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.karjun.dmaxcam'
        minSdk 24
        // The head unit runs Android 11; targeting 30 keeps background-start and USB rules simple.
        targetSdk 30
        versionCode 7
        versionName '1.6'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation project(':camcore')
}
