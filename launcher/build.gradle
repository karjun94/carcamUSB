plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karjun.dmaxlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.karjun.dmaxlauncher'
        minSdk 24
        // Same reasoning as the camera app: the head unit runs Android 11.
        targetSdk 30
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    // USB camera preview in the dashboard card (same library as D-Max Cam).
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
